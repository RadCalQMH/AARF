<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The visual guide to measurements</title>
<style>
  html, body { height:100%; margin:0; }
  #pdf-container { width:100%; height:100%; }
  #pdf-container { border:1px solid #ddd; }
</style>
</head>
<body>

<div id="pdf-container">
  <iframe id="pdf-frame"
          src="about:blank"
          width="100%"
          height="100%"
          frameborder="0"
          allowfullscreen
          webkitallowfullscreen>
  </iframe>
</div>

<script>
  // ---- CONFIGURATION -------------------------------------------------
  // Replace this with the URL of the PDF you want to display.
  // It must be accessible via CORS, or you must point to your own proxy.
  const remotePdfUrl = 'https://raw.githubusercontent.com/RadCalQMH/AARF/main/guide.pdf';

  // PDF.js viewer hosted on a CDN (you can also self‑host)
  const pdfJsViewer = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.2.67/web/viewer.html';
  // -------------------------------------------------------------------

  // Encode the PDF URL for safe inclusion in the query string
  const encodedPdfUrl = encodeURIComponent(remotePdfUrl);

  // Build the final viewer URL
  const viewerUrl = `${pdfJsViewer}?file=${encodedPdfUrl}`;

  // Insert the viewer into the iframe
  document.getElementById('pdf-frame').src = viewerUrl;
</script>

</body>
</html>
